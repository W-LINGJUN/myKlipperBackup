# =====================================================================
#  KAMP —— Klipper Adaptive Meshing & Purging
#  上游：https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging
#  版本：main @ 997838cb36 (2026-09-14)   许可：GPL-3.0（见 LICENSE.md）
#
#  ⚠ 本文件已按「本机 Voron 2.4 300 + BTT Eddy」调整过变量。
#    以后升级 KAMP 时请对比上游改动，不要直接整目录覆盖。
#
#  ⚠ 下面几行是上游的 include 写法，但 Klipper 的 include 路径是
#    「相对于包含它的这个文件」，放在本文件里会被解析成
#    config/KAMP/KAMP/xxx.cfg 从而报 include 不存在。
#    所以这里保持注释，实际启用写在 printer.cfg 的 KAMP 段里
#    （同一个文件只能被 include 一次，否则 BED_MESH_CALIBRATE 会重复注册）。
# =====================================================================

#[include ./KAMP/Adaptive_Meshing.cfg]       # 自适应网格
#[include ./KAMP/Line_Purge.cfg]             # 自适应直线清洗
#[include ./KAMP/Voron_Purge.cfg]            # Voron logo 清洗
#[include ./KAMP/Smart_Park.cfg]             # 打印前就近停靠等升温

[gcode_macro _KAMP_Settings]
description: KAMP 全部可调参数集中在这一段

# ---------------- 通用 ----------------
variable_verbose_enable: False              # 上游默认 True；关掉后控制台不再刷一大堆网格计算信息

# ---------------- 自适应网格 ----------------
variable_mesh_margin: 5                     # 在模型范围外扩 5mm 再测，边缘过渡更稳；设 0 更快
variable_fuzz_amount: 0                     # 涡流探针不接触床面，不需要打散网格点防磨

# ---------------- 可插拔探针（本机是固定式 Eddy，保持关闭）----------------
variable_probe_dock_enable: False
variable_attach_macro: 'Attach_Probe'
variable_detach_macro: 'Dock_Probe'

# ---------------- 自适应清洗 ----------------
variable_purge_height: 0.8                  # 清洗时喷嘴高度
variable_tip_distance: 5                    # 与 PRINT_END 里的 G1 E-5.0 对应，清洗前先把料推回喷嘴
variable_purge_margin: 10                   # 清洗线距模型区的前置距离
variable_purge_amount: 30                   # 清洗耗材长度
variable_flow_rate: 12                      # 清洗流量 mm3/s

# ---------------- Smart Park ----------------
variable_smart_park_height: 10              # 打印开始前把喷嘴停在模型附近这个高度等升温

gcode: # Gcode section left intentionally blank. Do not disturb.

    {action_respond_info(" KAMP_Settings only stores variables, running it does nothing. ")}
