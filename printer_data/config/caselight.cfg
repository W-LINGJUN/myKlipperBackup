[output_pin caselight]
pin: PD15
pwm: true
hardware_pwm: False
shutdown_value: 0
value: 0.4
cycle_time: 0.00025

[gcode_macro CASE_LIGHT_FADE_TO_PRINT]
gcode:
    {% set target = 0.3 %}
    {% set steps = 10 %}
    {% set start = printer["output_pin caselight"].value %}
    {% set delta = (target - start) / steps %}
    {% for i in range(1, steps+1) %}
        SET_PIN PIN=caselight VALUE={ "%.2f"|format(start + i*delta) }
        G4 P80
    {% endfor %}

[gcode_macro CASE_LIGHT_FADE_OUT]
gcode:
    {% set start = printer["output_pin caselight"].value %}
    {% set steps = 20 %}
    {% set delta = start / steps %}
    {% for i in range(1, steps+1) %}
        SET_PIN PIN=caselight VALUE={ "%.2f"|format(start - i*delta) }
        G4 P100
    {% endfor %}
    SET_PIN PIN=caselight VALUE=0

[gcode_macro CASE_LIGHT_RESET_IDLE]
gcode:
    UPDATE_DELAYED_GCODE ID=CASE_LIGHT_IDLE_TIMEOUT DURATION=300

[delayed_gcode CASE_LIGHT_IDLE_TIMEOUT]
gcode:
    CASE_LIGHT_FADE_OUT