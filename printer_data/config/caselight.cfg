## Chamber Lighting - HE2 Connector (Optional)
[output_pin caselight]
##Octopus 1.0 & 1.1, Octopus PRO 1.0
#pin: PB10
pin: PD15
##Octopus PRO 1.1
#pin: PB0
pwm:true
hardware_pwm: False
value: 0.20 #startup value
shutdown_value: 0
cycle_time: 0.00025

[delayed_gcode CASE_LIGHT_BOOT]
initial_duration: 2.5
gcode:
    {% set target = 0.4 %}
    {% set steps = 20 %}
    {% set step = target / steps %}
    {% for i in range(1, steps+1) %}
        SET_PIN PIN=caselight VALUE={ "%.2f"|format(i*step) }
        G4 P100
    {% endfor %}

[gcode_macro CASE_LIGHT_FADE_TO_PRINT]
gcode:
    {% set target = 0.3 %}
    {% set steps = 10 %}
    {% set start = printer.output_pin.caselight.value %}
    {% set delta = (target - start) / steps %}
    {% for i in range(1, steps+1) %}
        SET_PIN PIN=caselight VALUE={ "%.2f"|format(start + i*delta) }
        G4 P80
    {% endfor %}

[gcode_macro CASE_LIGHT_FADE_OUT]
gcode:
    {% set start = printer.output_pin.caselight.value %}
    {% set steps = 20 %}
    {% set delta = start / steps %}
    {% for i in range(1, steps+1) %}
        SET_PIN PIN=caselight VALUE={ "%.2f"|format(start - i*delta) }
        G4 P100
    {% endfor %}
    SET_PIN PIN=caselight VALUE=0

[gcode_macro CASE_LIGHT_RESET_IDLE]
gcode:
    UPDATE_DELAYED_GCODE ID=CASE_LIGHT_IDLE_TIMEOUT DURATION=300 ; 空闲5分钟淡出

[delayed_gcode CASE_LIGHT_IDLE_TIMEOUT]
gcode:
    CASE_LIGHT_FADE_OUT