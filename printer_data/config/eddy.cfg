[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044467290B9D61C-if00
restart_method: command

#####################################################################
# BTT Eddy USB (通过 Nitehawk SB V2 副 USB 口)
#####################################################################


[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
z_offset: 2.5                    # 初始值，校准后会自动保存
i2c_mcu: eddy
i2c_bus: i2c0f
# 标准 Stealthburner 安装的默认偏移，后续用 PROBE_CALIBRATE 精确调整
x_offset: 0
y_offset: 21.42

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2

#####################################################################
# Bed Mesh（300mm 床）
#####################################################################
[bed_mesh]
horizontal_move_z: 2
speed: 200
# 300mm 床推荐范围（已按官方公式计算，探针中心可达）
mesh_min: 20, 20
mesh_max: 280, 280
probe_count: 9, 9                # 想更密可改成 11,11 或 13,13
algorithm: bicubic
# scan_overshoot: 8              # 如果 X 方向还有余量可取消注释

#####################################################################
# Safe Z Home（用 Eddy 做 Z 限位）
#####################################################################
[safe_z_home]
home_xy_position: 150, 150       # 300mm 床中心
z_hop: 10
z_hop_speed: 15
speed: 100

#####################################################################
# 必须开启的辅助配置（因为用 Eddy 做 Z 限位）
#####################################################################
[force_move]
enable_force_move: True

# 可选：想用 beta 的 z-offset 持久化功能再取消注释
# [save_variables]
# filename: \~/printer_data/config/variables.cfg

#####################################################################
# 宏（推荐全部保留）
#####################################################################

[gcode_macro G28]
rename_existing: G28.1
gcode:
  G28.1 {rawparams}
  {% if not rawparams or (rawparams and 'Z' in rawparams) %}
    PROBE
    SET_Z_FROM_PROBE
  {% endif %}

[gcode_macro SET_Z_FROM_PROBE]
gcode:
  {% set cf = printer.configfile.settings %}
  SET_GCODE_OFFSET_ORIG Z={printer.probe.last_z_result - cf['probe_eddy_current btt_eddy'].z_offset + printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset|default(0)}
  G90
  G1 Z{cf.safe_z_home.z_hop}

[gcode_macro SET_GCODE_OFFSET]
rename_existing: SET_GCODE_OFFSET_ORIG
variable_restored: False
variable_runtime_offset: 0
gcode:
  {% if params.Z_ADJUST %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE={ printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset + params.Z_ADJUST|float }
  {% endif %}
  {% if params.Z %}
    {% set paramList = rawparams.split() %}
    {% for i in range(paramList|length) %}
      {% if paramList[i]=="Z=0" %}
        {% set temp=paramList.pop(i) %}
        {% set temp="Z_ADJUST=" + (-printer["gcode_macro SET_GCODE_OFFSET"].runtime_offset)|string %}
        {% if paramList.append(temp) %}{% endif %}
      {% endif %}
    {% endfor %}
    {% set rawparams=paramList|join(' ') %}
    SET_GCODE_VARIABLE MACRO=SET_GCODE_OFFSET VARIABLE=runtime_offset VALUE=0
  {% endif %}
  SET_GCODE_OFFSET_ORIG { rawparams }

[gcode_macro PROBE_EDDY_CURRENT_CALIBRATE_AUTO]
gcode:
  BED_MESH_CLEAR
  G28 X Y
  G90
  G1 X{ printer.toolhead.axis_maximum.x/2 } Y{ printer.toolhead.axis_maximum.y/2 } F6000
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z={ printer.toolhead.axis_maximum.z-1 }
  {% endif %}
  PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy