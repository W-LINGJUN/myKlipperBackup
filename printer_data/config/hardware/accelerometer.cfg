#####################################################################
#  共振测量（输入整形）
#
#  ADXL345 通过 Nitehawk 的软件 SPI 连接。
#  原配置装了加速度计却没有任何 [input_shaper]，等于白装：
#  跑一次 CALIBRATE_SHAPER（见 macros/calibration.cfg）后执行
#  SAVE_CONFIG，下面这个空段会被自动写入 shaper 参数。
#####################################################################

[adxl345]
cs_pin: nhk:PB10
spi_software_sclk_pin: nhk:PA5
spi_software_mosi_pin: nhk:PA2
spi_software_miso_pin: nhk:PA6

[resonance_tester]
accel_chip: adxl345
probe_points:
   155, 155, 20
accel_per_hz: 100
sweeping_accel: 400
# sweeping_period: 0 会关闭慢扫，测量精度略差；
# 恢复官方默认 1.2s（此时 sweeping_accel 才起作用）
sweeping_period: 1.2

##  这里先留一个空段：
##  1) 空段不会启用任何整形（shaper_freq 默认 0 = 关闭），安全；
##  2) 有了该段，SHAPER_CALIBRATE 才会把结果写进来。
[input_shaper]
