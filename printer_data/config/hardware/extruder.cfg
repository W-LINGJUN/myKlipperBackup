#####################################################################
#  挤出机 —— Stealthburner + Clockwork 2，电机/热端/热敏全部在 Nitehawk
#####################################################################

[extruder]
step_pin: nhk:PB8
dir_pin: nhk:PB9
enable_pin: !nhk:PC14
##  E 步进已按实际挤出量标定过：
##  rotation_distance = 旧值 * 实际挤出长度 / 100
rotation_distance: 22.452161589
gear_ratio: 50:10                # Stealthburner / Clockwork 2
microsteps: 32
full_steps_per_rotation: 200     # 1.8 度电机
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: nhk:PA7
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: nhk:PB12
pullup_resistor: 2200            # Nitehawk 板上是 2.2k 上拉
min_temp: 10
max_temp: 270
max_power: 1.0
min_extrude_temp: 170
##  KAMP 的 LINE_PURGE / VORON_PURGE 会检查这个值，
##  小于 5 就会「静默跳过清洗」（默认 4 会导致清洗根本不发生）
max_extrude_cross_section: 5
##  PID 由 SAVE_CONFIG 保存在 printer.cfg 末尾，勿在此手填
pressure_advance: 0.03           # 换耗材/换喷嘴后重新测 PA

[tmc2209 extruder]
uart_pin: nhk:PB7
tx_pin: nhk:PB6
interpolate: false
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0
