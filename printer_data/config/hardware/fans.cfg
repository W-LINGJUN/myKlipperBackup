#####################################################################
#  风扇
#  注意：控制器风扇和仓内排风扇都接在主控上，工具头风扇接在 Nitehawk 上
#####################################################################

##  模型冷却风扇 —— FAN0（工具头）
[fan]
pin: nhk:PA15
kick_start_time: 0.5
off_below: 0.10                  # 风扇低速起不转时可适当提高

##  热端散热风扇 —— FAN1（工具头）
[heater_fan hotend_fan]
pin: nhk:PD0
#tachometer_pin: nhk:PD1
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
#fan_speed: 1.0

##  驱动/主控散热风扇 —— FAN2（主控箱）
##  说明：不写 stepper: 时 controller_fan 默认监控「所有」电机，
##        因此这里只需补上热床，电机发热已经被覆盖。
[controller_fan controller_fan]
pin: PD12
kick_start_time: 0.5
heater: heater_bed
idle_timeout: 30

##  仓内排风扇 —— FAN3（过滤/排气）
[heater_fan exhaust_fan]
pin: PD13
max_power: 1.0
shutdown_speed: 0.0
kick_start_time: 5.0
heater: heater_bed
heater_temp: 60
fan_speed: 1.0
