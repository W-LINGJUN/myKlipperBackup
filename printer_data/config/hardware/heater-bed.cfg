#####################################################################
#  热床
#  SSR 控制：HE1 / PA3    热敏：TB / PF3
#####################################################################

[heater_bed]
##  Voron 官方接线用 PA3；若你的线束走 BED_OUT 则改用 PA1
heater_pin: PA3
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: PF3
#pullup_resistor: 2200
##  max_power 用来限制 SSR 电流，公式：4 / (热床功率 / 市电电压)，上限 1.0
max_power: 0.8
min_temp: 0
max_temp: 120
##  PID 由 SAVE_CONFIG 保存在 printer.cfg 末尾，勿在此手填
