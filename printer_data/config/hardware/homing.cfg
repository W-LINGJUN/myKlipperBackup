#####################################################################
#  归零与龙门调平
#
#  ● Z 归零用 Eddy（probe:z_virtual_endstop），没有实体 Z 限位
#  ● [safe_z_home] 在这里只定义一次（原配置在 eddy.cfg 和
#    printer.cfg 里各写了一份，后者生效，前者是死代码）
#####################################################################

[safe_z_home]
##  Z 归零时探针所在位置（喷嘴坐标），300 机型取床中心
home_xy_position: 150, 150
speed: 50
z_hop: 10
z_hop_speed: 5

[quad_gantry_level]
##  300mm 机型龙门角点与探测点（探测点 = 探针坐标，非喷嘴坐标）
gantry_corners:
   -60,-10
   360,370
points:
   50,25
   50,225
   250,225
   250,25

speed: 100
horizontal_move_z: 10           # 必须大于 Eddy 的 descend_z(0.5)
retries: 5
retry_tolerance: 0.0075
max_adjust: 10                  # 单角修正超过 10mm 直接中止，防撞
