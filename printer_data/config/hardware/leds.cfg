#####################################################################
#  LED 硬件
#  机箱灯 / 板载状态灯 在主控上，RGB 灯珠在 Nitehawk 上
#  灯光相关宏在 macros/lights.cfg
#####################################################################

##  机箱灯 —— HE2 / PD15（软件 PWM 调光）
##  cycle_time 由原配置的 0.00025(4kHz) 改为 0.001(1kHz)：
##  两者肉眼无差别，但 4kHz 软件 PWM 会让 MCU 每秒处理上万次中断，
##  容易出现 "Timer too close"。若 PD15 支持硬件 PWM 可改
##  hardware_pwm: True 并去掉 cycle_time。
[output_pin caselight]
pin: PD15
pwm: true
hardware_pwm: False
cycle_time: 0.001
value: 0.4                       # 开机亮度
shutdown_value: 0

##  工具头 PCB 指示灯（Nitehawk SB）
[output_pin pcb_led]
pin: !nhk:PC6

##  工具头 RGB 灯珠：1 = SB 标识灯，2/3 = 照明
[neopixel rgb_light]
pin: nhk:PD3
chain_count: 3
color_order: GRBW
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
