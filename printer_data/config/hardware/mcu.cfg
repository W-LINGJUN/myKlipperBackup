#####################################################################
#  MCU 定义
#  三块板：
#    主控   BTT Octopus V1 (STM32F446)   —— XY/Z 电机、热床、仓内风扇
#    nhk    Nitehawk SB V2 (RP2040)      —— 工具头挤出机、热端、风扇、ADXL、灯
#    eddy   BTT Eddy (RP2040)            —— 电涡流探针 + 线圈温度
#
#  串口用 by-id 路径；换板/换 USB 口后要重新确认：
#      ls /dev/serial/by-id/*
#####################################################################

[mcu]
##  主控 —— 拔掉 USB 后该路径应消失，以此确认对应关系
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_110042001350535556323420-if00
restart_method: command

[mcu nhk]
##  工具头 Nitehawk SB V2
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_430055000451353032333039-if00
restart_method: command

[mcu eddy]
##  BTT Eddy，走 Nitehawk 的副 USB 口
serial: /dev/serial/by-id/usb-Klipper_rp2040_5044467290B9D61C-if00
restart_method: command
