#####################################################################
#  BTT Eddy 电涡流探针 + 床网格
#
#  重要：新版 Klipper 的 [probe_eddy_current] 已经没有 z_offset 选项，
#  改由 descend_z 描述“探针停止时喷嘴到床的距离”，绝对高度由下面
#  自动保存块里的 calibrate 频率-高度表换算，所以不需要 z_offset。
#
#  校准流程见 macros/calibration.cfg（CALIBRATE_EDDY 等）
#####################################################################

##  Eddy 板载 MCU 温度（只是健康监控）
[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
##  探针停止时喷嘴到床面的距离。官方推荐 0.5；
##  原配置是 2.5（从旧 z_offset 抄过来的），比床网格的
##  horizontal_move_z 还大，会导致探针“一出发就已经触发”。
descend_z: 0.5
i2c_mcu: eddy
i2c_bus: i2c0f
##  Stealthburner 安装偏移，换工具头/换安装件后必须重测
x_offset: 0
y_offset: 21.42

##  线圈温度传感器（用于温漂补偿）
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 5             # 必须大于 descend_z
##  以下参数为温漂校准（TEMPERATURE_PROBE_CALIBRATE）自动化用
calibration_position: 155, 155, 1
calibration_bed_temp: 100        # 校准期间床温上限（绝对值需 > 50）
calibration_extruder_temp: 200   # 校准期间热端温度，避免喷嘴热膨胀干扰
extruder_heating_z: 50
max_validation_temp: 110         # 封箱机强烈建议设 100~120

#####################################################################
#  床网格（300mm 床）
#
#  mesh_min / mesh_max 是「探针」坐标，实际喷头位置要减去 y_offset：
#     mesh_min Y = 25  ->  喷嘴 Y = 25 - 21.42 = 3.58  （正好在行程内）
#  若设成 20，喷嘴需要去 Y = -1.42，会直接 Move out of range。
#####################################################################
[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 20, 25
mesh_max: 280, 280
probe_count: 9, 9
algorithm: bicubic
