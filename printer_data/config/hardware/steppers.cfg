#####################################################################
#  电机 / TMC2209（X 300mm 机型）
#  AWD 说明：X/Y 用 MOTOR_0/1，Z 用 MOTOR_2~5，E 在 Nitehawk 上
#####################################################################

#--------------------------------------------------------------------
#  X —— 左后（B 电机），MOTOR_0，限位 DIAG_0 / PG6
#--------------------------------------------------------------------
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400     # 0.9 度电机
endstop_pin: PG6
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
#  Y —— 右后（A 电机），MOTOR_1，限位 DIAG_1 / PG9
#--------------------------------------------------------------------
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 400     # 0.9 度电机
endstop_pin: PG9
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 25
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PD11
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
#  Z0 —— 前左，MOTOR_2
#  Z 限位使用 Eddy（probe:z_virtual_endstop），不再用 PG10 的实体限位
#--------------------------------------------------------------------
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 260
position_min: -5                 # 电涡流探针需要能走到负 Z 才谈得上“触底”
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PC6
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
#  Z1 —— 后左，MOTOR_3
#  enable_pin：Octopus 1.0/1.1 与 PRO 1.0 用 PA0；PRO 1.1 用 PA2
#--------------------------------------------------------------------
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA0
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PC7
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
#  Z2 —— 后右，MOTOR_4
#--------------------------------------------------------------------
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PF2
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#--------------------------------------------------------------------
#  Z3 —— 前右，MOTOR_5
#--------------------------------------------------------------------
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PE4
interpolate: false
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0
