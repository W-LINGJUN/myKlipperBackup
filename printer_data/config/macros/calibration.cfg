#####################################################################
#  校准宏（全部需要人工确认，跑完记得执行 SAVE_CONFIG）
#
#  推荐顺序（上传配置后第一次）：
#    1) CALIBRATE_MESH          在打印温度下重测床网格
#       -> SAVE_CONFIG
#    2) CALIBRATE_EDDY          重测 Eddy 频率-高度表
#       -> SAVE_CONFIG
#    3) CALIBRATE_EDDY_TEMP     封箱机建议做温漂补偿
#       -> SAVE_CONFIG
#    4) CALIBRATE_SHAPER        测共振，生成 input_shaper
#       -> SAVE_CONFIG，然后把 [printer] max_accel 调高
#####################################################################

[gcode_macro CALIBRATE_MESH]
description: 在打印温度下测床网格并保存为 default
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(100)|float %}
    SAVE_GCODE_STATE NAME=STATE_CAL_MESH
    G90
    CHOME
    M140 S{BED_TEMP}
    M190 S{BED_TEMP}
    QUAD_GANTRY_LEVEL
    G28 Z
    BED_MESH_CALIBRATE
    BED_MESH_PROFILE SAVE=default
    BED_MESH_PROFILE LOAD=default
    M140 S0
    M117 Mesh saved, run SAVE_CONFIG
    RESTORE_GCODE_STATE NAME=STATE_CAL_MESH

[gcode_macro CALIBRATE_SHAPER]
description: 测 X/Y 共振，结果写入 [input_shaper]
gcode:
    SAVE_GCODE_STATE NAME=STATE_CAL_SHAPER
    CHOME
    SHAPER_CALIBRATE
    M117 Shaper done, run SAVE_CONFIG
    RESTORE_GCODE_STATE NAME=STATE_CAL_SHAPER

[gcode_macro CALIBRATE_EDDY]
description: 重测 Eddy 频率-高度表（过程中需要按提示用纸片测 Z0 并 ACCEPT）
gcode:
    SAVE_GCODE_STATE NAME=STATE_CAL_EDDY
    CHOME
    G90
    G1 X155 Y155 Z20 F3000
    M117 Paper test then ACCEPT
    PROBE_EDDY_CURRENT_CALIBRATE CHIP=btt_eddy
    M117 Eddy calibrated, run SAVE_CONFIG
    RESTORE_GCODE_STATE NAME=STATE_CAL_EDDY

[gcode_macro CALIBRATE_EDDY_CURRENT]
description: 重测 Eddy 驱动电流（探针在床中心上方约 20mm 时执行）
gcode:
    SAVE_GCODE_STATE NAME=STATE_CAL_EDDY_CUR
    CHOME
    G90
    G1 X155 Y155 Z20 F3000
    LDC_CALIBRATE_DRIVE_CURRENT CHIP=btt_eddy
    M117 Current done, run SAVE_CONFIG
    RESTORE_GCODE_STATE NAME=STATE_CAL_EDDY_CUR

[gcode_macro CALIBRATE_EDDY_TEMP]
description: Eddy 温漂补偿校准（TARGET 为线圈最高温度，默认 80）
gcode:
    {% set TARGET = params.TARGET|default(80)|int %}
    SAVE_GCODE_STATE NAME=STATE_CAL_EDDY_TEMP
    CHOME
    M117 Temp drift cal, target {TARGET}C
    TEMPERATURE_PROBE_CALIBRATE PROBE=btt_eddy TARGET={TARGET}
    M117 Drift cal done, run SAVE_CONFIG
    RESTORE_GCODE_STATE NAME=STATE_CAL_EDDY_TEMP

#####################################################################
#  诊断：KAMP 自适应网格 / 清洗是否真的会生效
#  打印开始后（或打印中）执行 KAMP_CHECK 即可，不需要改任何参数。
#####################################################################
[gcode_macro KAMP_CHECK]
description: 诊断当前是否有模型信息可用于 KAMP 自适应网格 / 自适应清洗
gcode:
    {% set objs = printer.exclude_object.objects %}
    {% set mesh_min = printer.configfile.settings.bed_mesh.mesh_min %}
    {% set mesh_max = printer.configfile.settings.bed_mesh.mesh_max %}
    {% set margin = printer["gcode_macro _KAMP_Settings"].mesh_margin | float %}
    {% if objs %}
        {% set pts = objs | map(attribute='polygon') | sum(start=[]) %}
        {% set ax_min = [pts | map(attribute=0) | min - margin, mesh_min[0]] | max %}
        {% set ay_min = [pts | map(attribute=1) | min - margin, mesh_min[1]] | max %}
        {% set ax_max = [pts | map(attribute=0) | max + margin, mesh_max[0]] | min %}
        {% set ay_max = [pts | map(attribute=1) | max + margin, mesh_max[1]] | min %}
        {action_respond_info("KAMP OK: 检出 {} 个对象，自适应网格范围约 X {}~{} / Y {}~{}".format(objs|length, ax_min|round(1), ax_max|round(1), ay_min|round(1), ay_max|round(1)))}
        {action_respond_info("KAMP OK: 网格会按此范围缩减探测点数，清洗走 LINE_PURGE。")}
    {% else %}
        {action_respond_info("KAMP 未生效: 当前没有模型信息，网格会退回全长、清洗退回床前固定线。")}
        {action_respond_info("排查: 1) 切片软件是否开了 Label objects  2) moonraker.conf 的 enable_object_processing 是否为 True  3) 旧 gcode 需重新切片或重传")}
    {% endif %}
