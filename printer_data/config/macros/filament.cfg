#####################################################################
#  换料宏
#    LOAD_FILAMENT / UNLOAD_FILAMENT / M600
#  流程：M600 -> 暂停 -> 卸载 -> 手动换料 -> LOAD_FILAMENT -> RESUME
#####################################################################

[gcode_macro UNLOAD_FILAMENT]
description: 卸载耗材（默认 240 度）
gcode:
    {% set TEMP     = params.TEMP|default(240)|float %}
    {% set MIN_TEMP = TEMP * 0.98 %}
    SAVE_GCODE_STATE NAME=STATE_UNLOAD
    CHOME
    G90
    G1 Z20 F3000
    FRONT
    {% if TEMP > 0 %}
        _LOGO_PENDING
        {% if printer.extruder.target|float < TEMP %}
            M104 S{TEMP}
        {% endif %}
        TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP}
    {% endif %}
    _LOGO_READY
    M83
    G1 E10 F300
    G1 E-8 F3600
    G4 P200
    G1 E-50 F400
    G1 E-20 F300
    M400
    M117 Unload complete
    _LOGO_OFF
    RESTORE_GCODE_STATE NAME=STATE_UNLOAD

[gcode_macro LOAD_FILAMENT]
description: 装载耗材（默认 240 度）
gcode:
    {% set TEMP     = params.TEMP|default(240)|float %}
    {% set MIN_TEMP = TEMP * 0.98 %}
    SAVE_GCODE_STATE NAME=STATE_LOAD
    FRONT
    {% if TEMP > 0 %}
        _LOGO_PENDING
        {% if printer.extruder.target|float < TEMP %}
            M104 S{TEMP}
        {% endif %}
        TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP}
    {% endif %}
    _LOGO_READY
    _HEADLIGHT_ON
    M83
    G1 E50 F300
    G1 E50 F300
    M400
    M117 Load complete
    _LOGO_OFF
    _HEADLIGHT_OFF
    RESTORE_GCODE_STATE NAME=STATE_LOAD

[gcode_macro M600]
description: 中途换料：暂停并卸载，换好后执行 LOAD_FILAMENT 再 RESUME
gcode:
    ##  温度取「当前目标温度」与 240 的较大值，
    ##  避免打印结束后（目标温度 0）出现冷挤出报错。
    {% set TEMP = params.TEMP|default([printer.extruder.target|int, 240]|max)|int %}
    PAUSE
    M117 Unloading (TEMP={TEMP})
    UNLOAD_FILAMENT TEMP={TEMP}
    M117 Load new filament then LOAD_FILAMENT and RESUME
