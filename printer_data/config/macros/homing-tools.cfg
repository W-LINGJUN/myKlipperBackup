#####################################################################
#  归零 / 移动工具宏
#####################################################################

[gcode_macro CHOME]
description: 未归零时才执行 G28（已归零则立即返回）
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro FRONT]
description: 移动到床前部中央，方便换料
gcode:
    CHOME
    {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
    G90
    G1 X{x_center} Y10 F7800

[gcode_macro PARK]
description: 移动到床中心上方 30mm
gcode:
    {% set th = printer.toolhead %}
    G90
    G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y // 2} Z30

[gcode_macro G32]
description: 完整归零：G28 -> 龙门调平 -> 重新定 Z -> 停靠
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28 Z
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro QGL]
description: 只做龙门调平（已归零前提下）
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    QUAD_GANTRY_LEVEL
    G28 Z
