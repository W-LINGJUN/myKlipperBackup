#####################################################################
#  灯光宏
#  ● 机箱灯（output_pin caselight，PWM 调光，可渐变）
#  ● 工具头 RGB（neopixel rgb_light：1 = 标识灯，2/3 = 照明）
#####################################################################

#####################################################################
#  机箱灯
#####################################################################

##  内部通用渐变，TARGET: 0~1
[gcode_macro _CASE_LIGHT_FADE]
description: 内部用：把机箱灯渐变到 TARGET
gcode:
    {% set target = params.TARGET|default(0.4)|float %}
    {% set steps  = params.STEPS|default(10)|int %}
    {% set delay  = params.DELAY|default(60)|int %}
    {% set start  = printer["output_pin caselight"].value|float %}
    {% if (start - target)|abs > 0.01 %}
        {% set delta = (target - start) / steps %}
        {% for i in range(1, steps + 1) %}
            SET_PIN PIN=caselight VALUE={"%.2f"|format(start + i * delta)}
            G4 P{delay}
        {% endfor %}
    {% endif %}
    SET_PIN PIN=caselight VALUE={"%.2f"|format(target)}

[gcode_macro CASE_LIGHT_ON]
description: 机箱灯渐亮至 100%
gcode:
    _CASE_LIGHT_FADE TARGET=1.00 STEPS=10 DELAY=60
    CASE_LIGHT_RESET_IDLE

[gcode_macro CASE_LIGHT_OFF]
description: 机箱灯渐灭
gcode:
    _CASE_LIGHT_FADE TARGET=0.00 STEPS=15 DELAY=60

[gcode_macro CASE_LIGHT_DIM]
description: 机箱灯调到打印亮度 30%
gcode:
    _CASE_LIGHT_FADE TARGET=0.30 STEPS=10 DELAY=60

##  打印开始时调用（保留旧名字，切片/宏里已在用）
[gcode_macro CASE_LIGHT_FADE_TO_PRINT]
description: 打印开始：调暗机箱灯并重置空闲计时
gcode:
    CASE_LIGHT_DIM
    CASE_LIGHT_RESET_IDLE

##  打印结束时调用（保留旧名字）
[gcode_macro CASE_LIGHT_FADE_OUT]
description: 打印结束：关闭机箱灯
gcode:
    CASE_LIGHT_OFF

[gcode_macro CASE_LIGHT_RESET_IDLE]
description: 重置「空闲自动关灯」计时（默认 5 分钟）
gcode:
    UPDATE_DELAYED_GCODE ID=CASE_LIGHT_IDLE_TIMEOUT DURATION=300

##  空闲自动关灯：开机 5 分钟后开始每分钟检查一次，
##  只有 idle_timeout 处于 Idle 状态（没在打印/没在加热）时才熄灯，
##  这样原配置里“定义了却永远不会被触发”的空闲淡出才真正生效。
[delayed_gcode CASE_LIGHT_IDLE_TIMEOUT]
initial_duration: 300
gcode:
    UPDATE_DELAYED_GCODE ID=CASE_LIGHT_IDLE_TIMEOUT DURATION=60
    {% if printer.idle_timeout.state == "Idle" and printer["output_pin caselight"].value|float > 0.02 %}
        CASE_LIGHT_OFF
    {% endif %}

#####################################################################
#  工具头 RGB（rgb_light，3 颗灯珠）
#    INDEX=1  SB 标识灯
#    INDEX=2,3 照明
#####################################################################

[gcode_macro _LOGO_PENDING]
description: 标识灯 -> 冷蓝（执行中）
gcode:
    SET_LED LED=rgb_light RED=0.15 GREEN=0.50 BLUE=0.75 WHITE=0 INDEX=1

[gcode_macro _LOGO_READY]
description: 标识灯 -> 红（完成）
gcode:
    SET_LED LED=rgb_light RED=0.99 GREEN=0.00 BLUE=0.00 WHITE=0 INDEX=1

[gcode_macro _LOGO_OFF]
description: 标识灯关闭
gcode:
    SET_LED LED=rgb_light RED=0.00 GREEN=0.00 BLUE=0.00 WHITE=0 INDEX=1

[gcode_macro _HEADLIGHT_ON]
description: 工具头照明开（白）
gcode:
    SET_LED LED=rgb_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=2 TRANSMIT=0
    SET_LED LED=rgb_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=3

[gcode_macro _HEADLIGHT_OFF]
description: 工具头照明关
gcode:
    SET_LED LED=rgb_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=rgb_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3

##  Mainsail 侧方便点的按钮
[gcode_macro HEADLIGHT_TOGGLE]
description: 工具头照明开关
variable_state: 0
gcode:
    {% if state|int == 0 %}
        _HEADLIGHT_ON
        SET_GCODE_VARIABLE MACRO=HEADLIGHT_TOGGLE VARIABLE=state VALUE=1
    {% else %}
        _HEADLIGHT_OFF
        SET_GCODE_VARIABLE MACRO=HEADLIGHT_TOGGLE VARIABLE=state VALUE=0
    {% endif %}
