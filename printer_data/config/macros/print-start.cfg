#####################################################################
#  PRINT_START —— 切片软件起始 G-code 调用
#
#  参数（全部可选）：
#    BED_TEMP       床温，默认 60
#    EXTRUDER_TEMP  喷头温度，默认 240
#    CHAMBER_TEMP   腔温等待目标，默认 0 = 不等待
#    PURGE_AMOUNT   清洗长度，默认 30（仅在拿不到模型信息时使用）
#    STANDBY_TEMP   热端预热（待机）温度，默认 150；设 0 = 不做预热
#    QGL            1 = 做龙门调平（默认）；0 = 跳过，省 40~90 秒
#    MESH           auto（默认）/ calibrate / profile(或 0、none 表示不重测)
#                   profile = 直接用已保存的 default 网格，省 30~40 秒
#
#  ★ 时间优化要点（这是本版最重要的改动）：
#     原来：归零 → 等床温 → 调平 → 测网格 → 等热端 —— 纯串行，热端要等 1 分钟
#     现在：① 一上来就用 M140 / M104 把床和热端点起来（不等待）
#           ② 归零、等床温、调平、测网格的这几分钟里，热端已经在升到 150 待机
#           ③ 最后 M104/M109 只需从 150 补到目标温度
#     热床和热端都是"给定时间就好"，把它们与机械动作重叠 = 白赚一段等待。
#
#  连打同一个模型/连续几个模型想要更快：
#     PRINT_START ... QGL=0 MESH=profile
#   （依赖上一次的调平结果和网格，首次打印/搬动机器后不要用）
#
#  KAMP 集成说明：
#    ● 能拿到模型轮廓（切片开了对象标签 + moonraker 物件处理）时，
#      BED_MESH_CALIBRATE 会变成「只测模型范围的小网格」，
#      清洗走 LINE_PURGE（贴着模型区旁边画线）。
#    ● 拿不到模型信息时，自动退回：加载已保存的 default 网格 / 全长网格，
#      清洗退回床前固定位置的清洗线。所以对「没标签的旧 gcode」也不会炸。
#
#  切片软件示例（OrcaSlicer / PrusaSlicer 机器起始 G-code）：
#    PRINT_START BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature] CHAMBER_TEMP=45
#####################################################################

[gcode_macro PRINT_START]
description: 打印起始流程（升温与归零/调平/网格并行，缩短等待）
gcode:
    ##  兼容旧切片软件的参数名：Orca/Prusa 的老机器配置传的是 BED= / EXTRUDER=，
    ##  而本宏读的是 BED_TEMP / EXTRUDER_TEMP。以前只认新名字，旧 G-code 传的
    ##  70℃ 会被忽略、退回默认 60℃ —— M140 把已经热到 70 的床又拉回 60，
    ##  PETG 首层粘不住，是「打一半废掉」的隐形原因之一。
    {% set BED_TEMP = params.BED_TEMP if params.BED_TEMP is defined else (params.BED if params.BED is defined else 60) %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP if params.EXTRUDER_TEMP is defined else (params.EXTRUDER if params.EXTRUDER is defined else 240) %}
    {% set BED_TEMP      = BED_TEMP|float %}
    {% set EXTRUDER_TEMP = EXTRUDER_TEMP|float %}
    {% set CHAMBER_TEMP  = params.CHAMBER_TEMP|default(0)|float %}
    {% set PURGE_AMOUNT  = params.PURGE_AMOUNT|default(30)|float %}
    {% set STANDBY_TEMP  = params.STANDBY_TEMP|default(150)|float %}
    {% set DO_QGL        = params.QGL|default(1)|int %}
    {% set MESH_MODE     = params.MESH|default('auto')|lower %}
    {% set HAS_OBJECTS   = printer.exclude_object.objects|length > 0 %}
    {% set HAVE_PROFILE  = "default" in printer.bed_mesh.profiles %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_START
    G90
    M83

    ##  上一次异常取消可能留下暂停状态
    {% if printer.pause_resume.is_paused %}
        CLEAR_PAUSE
    {% endif %}

    ##  ── 阶段 0：先把床和热端点起来，不等待 ──────────────────────
    ##  这两条只是"下命令"，后面的归零/调平/测网格期间它们在后台升温。
    M140 S{BED_TEMP}
    {% if STANDBY_TEMP > 0 and printer.extruder.temperature|float < STANDBY_TEMP %}
        M104 S{STANDBY_TEMP}
    {% endif %}

    ##  ── 阶段 1：归零（与升温并行）────────────────────────────────
    {% if "xyz" not in printer.toolhead.homed_axes %}
        M117 Homing
        G28
    {% endif %}

    ##  ── 阶段 2：等床温（这时已经热了一大截）─────────────────────
    M117 Heating bed {BED_TEMP}C
    M190 S{BED_TEMP}

    {% if CHAMBER_TEMP > 0 %}
        M117 Waiting chamber {CHAMBER_TEMP}C
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    ##  ── 阶段 3：龙门调平（热态下做）+ 重新定 Z ────────────────────
    ##  G28 Z 放在调平判断之外：床已经到温，Z 零点必须按热态重新取一次，
    ##  这样即使 QGL=0 快速模式也不会用到冷态下取的旧零点（只花约 3 秒）。
    {% if DO_QGL %}
        M117 Leveling gantry
        QUAD_GANTRY_LEVEL
    {% endif %}
    G28 Z

    ##  ── 阶段 4：床网格 ──────────────────────────────────────────
    {% if MESH_MODE in ['profile', '0', 'none', 'off'] %}
        {% if HAVE_PROFILE %}
            M117 Loading saved mesh
            BED_MESH_PROFILE LOAD=default
        {% else %}
            M117 No saved mesh, probing
            BED_MESH_CALIBRATE
        {% endif %}
    {% elif MESH_MODE in ['calibrate', '1'] or HAS_OBJECTS or not HAVE_PROFILE %}
        M117 Probing mesh
        BED_MESH_CALIBRATE
    {% else %}
        M117 Loading saved mesh
        BED_MESH_PROFILE LOAD=default
    {% endif %}

    ##  ── 阶段 5：停靠到模型附近 + 热端补到打印温度 ────────────────
    {% if HAS_OBJECTS %}
        SMART_PARK
    {% endif %}
    M117 Heating hotend {EXTRUDER_TEMP}C
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    ##  ── 阶段 6：机箱灯 + 清洗 ───────────────────────────────────
    CASE_LIGHT_FADE_TO_PRINT
    M117 Purging
    {% if HAS_OBJECTS %}
        LINE_PURGE
    {% else %}
        G90
        G1 Z10 F3000
        G1 X10 Y10 F6000
        G1 Z0.3 F3000
        M83
        G1 E{PURGE_AMOUNT} F300
        G1 X10 Y60 F3000
        G1 E2 F300
        G1 Z2 F3000
        G1 E-2 F1800
        M400
        M106 S255
        G4 P1000
        M107
    {% endif %}

    M117 Print starting
    RESTORE_GCODE_STATE NAME=STATE_PRINT_START


#####################################################################
#  _SDCARD_ERROR —— G-code 执行出错时的处理（virtual_sdcard 回调）
#
#  背景：mainsail.cfg 里 [virtual_sdcard] 的 on_error_gcode 默认是
#  CANCEL_PRINT。只要 G-code 里有一条指令执行失败（越界移动、未知指令、
#  挤出量超限……），Klipper 就会把整个打印「优雅地」取消掉：
#    ● 历史里只剩 cancelled，看不出和用户主动取消的区别
#    ● 屏幕上只闪一下 !! 错误，事后很难追溯
#    ● 打印直接消失，没法从断点接回去
#
#  改成 PAUSE 后：机器停在出错的层，喷头按 PAUSE 逻辑停靠并保温，
#  控制台完整保留 Klipper 的 !! 原文，用户可以选择：
#    RESUME         —— 排除问题后接着打
#    CANCEL_PRINT   —— 确实要放弃
#####################################################################
[gcode_macro _SDCARD_ERROR]
description: G-code 出错时暂停并留下原因（替代默认的静默 CANCEL_PRINT）
gcode:
    {% set z_pos = printer.toolhead.position.z|default(0)|float %}
    {% set ps_info = printer.print_stats.info %}
    {% set layer = ps_info.current_layer if ps_info is not none and ps_info.current_layer is not none else -1 %}
    M118 !! SDCARD ERROR -> paused at Z={z_pos} layer={layer}
    RESPOND TYPE=error MSG="G-code 执行出错，已暂停（Z={z_pos}，层 {layer}）。请往上翻控制台的 !! 行看具体原因；处理完可 RESUME 继续，或 CANCEL_PRINT 放弃。"
    PAUSE
