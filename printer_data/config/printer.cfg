#####################################################################
#   Macros
#####################################################################
[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32
   
[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
#gcode:
#    G32                            ; home all axes
#    G90                            ; absolute positioning
#    G1 Z20 F3000                   ; move nozzle away from bed

#——————————————————————————————————————————————————#
#[gcode_macro PRINT_START]  #NEW
#   Use PRINT_START for the slicer starting script
#   Parameters:
#     BED_TEMP      - bed target temperature (default 60)
#     EXTRUDER_TEMP - extruder target temperature (default 240)
#     CHAMBER_TEMP  - optional chamber target temperature (default 0 = disabled)
#     PURGE_AMOUNT  - purge length in mm (default 30)
gcode:
	CASE_LIGHT_FADE_TO_PRINT
    # ------------------------------------------------------------
    # 1. Read parameters
    # ------------------------------------------------------------
    {% set BED_TEMP      = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(240)|float %}
    {% set CHAMBER_TEMP  = params.CHAMBER_TEMP|default(0)|float %}
    {% set PURGE_AMOUNT  = params.PURGE_AMOUNT|default(30)|float %}

    # ------------------------------------------------------------
    # 2. Save state and set absolute positioning
    # ------------------------------------------------------------
    SAVE_GCODE_STATE NAME=STATE_PRINT_START
    G90                            ; absolute positioning
    M83                            ; extruder relative mode

    # ------------------------------------------------------------
    # 3. Home if needed (safe: only homes once)
    # ------------------------------------------------------------
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # ------------------------------------------------------------
    # 4. Heat bed and wait
    # ------------------------------------------------------------
    M140 S{BED_TEMP}               ; set bed target
    M190 S{BED_TEMP}               ; wait for bed

    # ------------------------------------------------------------
    # 5. Optional chamber temperature wait
    # ------------------------------------------------------------
    {% if CHAMBER_TEMP > 0 %}
        M117 Waiting for chamber temperature...
        TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={CHAMBER_TEMP}
    {% endif %}

    # ------------------------------------------------------------
    # 6. Quad Gantry Level (after bed is hot, for thermal stability)
    # ------------------------------------------------------------
    QUAD_GANTRY_LEVEL

    # ------------------------------------------------------------
    # 7. Home again after QGL (Z reference is now correct)
    # ------------------------------------------------------------
    G28 Z
	# ------------------------------------------------------------
    # 7.5 Bed mesh calibration (new)
    # ------------------------------------------------------------
    BED_MESH_PROFILE LOAD=default
    # ------------------------------------------------------------
    
	# 8. Heat extruder and wait
    # ------------------------------------------------------------
    M104 S{EXTRUDER_TEMP}          ; set extruder target
    M109 S{EXTRUDER_TEMP}          ; wait for extruder

    # ------------------------------------------------------------
    # 9. Purge line at front of bed
    # ------------------------------------------------------------
    G90                            ; absolute positioning
    G1 Z10 F3000                   ; lift nozzle
    G1 X10 Y10 F6000               ; move to front-left purge position
    G1 Z0.3 F3000                  ; lower nozzle to purge height
    M83                            ; extruder relative mode
    G1 E{PURGE_AMOUNT} F300        ; purge
    G1 X10 Y60 F3000               ; wipe line
    G1 E2 F300                     ; small extra purge
    G1 Z2 F3000                    ; lift nozzle
    G1 E-2 F1800                   ; retract slightly to avoid stringing
    M400                           ; wait for moves to finish

    # ------------------------------------------------------------
    # 10. Turn on part cooling fan briefly to cool purge
    # ------------------------------------------------------------
    M106 S255
    G4 P1000
    M107

    # ------------------------------------------------------------
    # 11. Restore state and finish
    # ------------------------------------------------------------
    M117 Print starting...
    RESTORE_GCODE_STATE NAME=STATE_PRINT_START



[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F1800                 ; retract filament
    
    TURN_OFF_HEATERS
	CASE_LIGHT_FADE_OUT

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    
    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

[gcode_macro CHOME]
description: Homes XYZ axis only if printer is in a non-homed state
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
  CHOME
  {% set x_center = printer.toolhead.axis_maximum.x|float / 2.0 %}
  {% set y_center = printer.toolhead.axis_maximum.y|float / 2.0 %}
  G90
  G1 X{x_center} Y10 F7800

[gcode_macro _LOGO_PENDING]
gcode:
  SET_LED LED=rgb_light RED=0.15 GREEN=0.5 BLUE=0.75 WHITE=0 INDEX=1

[gcode_macro _LOGO_READY]
gcode:
  SET_LED LED=rgb_light RED=0.99 GREEN=0.0 BLUE=0.0 WHITE=0 INDEX=1

[gcode_macro _LOGO_OFF]
gcode:
  SET_LED LED=rgb_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=1

[gcode_macro _HEADLIGHT_ON]
gcode:
  SET_LED LED=rgb_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=2 TRANSMIT=0
  SET_LED LED=rgb_light RED=1 GREEN=1 BLUE=1 WHITE=1.0 INDEX=3

[gcode_macro _HEADLIGHT_OFF]
gcode:
  SET_LED LED=rgb_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=2 TRANSMIT=0
  SET_LED LED=rgb_light RED=0 GREEN=0 BLUE=0 WHITE=0 INDEX=3

[gcode_macro UNLOAD_FILAMENT]
description: Unloads filament from toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  CHOME
  G91
  G1 Z20
  FRONT
  {% if EXTRUDER_TEMP != 0 %}
    _LOGO_PENDING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP}
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP}
  {% endif %}
  _LOGO_READY
  M83
  G1 E10 F300
  G1 E-8 F3600
  G4 P200
  G1 E-50 F400
  G1 E-20 F300
  M400
  M117 Unload Complete!
  _LOGO_OFF

[gcode_macro LOAD_FILAMENT]
description: Loads new filament into toolhead
gcode:
  {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
  {% set MIN_TEMP = params.TEMP|default(230)|float * 0.98 %}
  {% set CURRENT_TARGET = printer.extruder.target|float %}
  FRONT
  {% if EXTRUDER_TEMP != 0 %}
    _LOGO_PENDING
    {% if CURRENT_TARGET < EXTRUDER_TEMP %}
      M104 S{EXTRUDER_TEMP}
    {% endif %}
    TEMPERATURE_WAIT SENSOR="extruder" MINIMUM={MIN_TEMP}
  {% endif %}
  _LOGO_READY
  _HEADLIGHT_ON
  M83
  G1 E50 F300
  G1 E50 F300
  M400
  M117 Load Complete!
  _LOGO_OFF
  _HEADLIGHT_OFF

[gcode_macro M600]
description: 临时换料：暂停并卸载，换好后运行 LOAD_FILAMENT 再 RESUME
gcode:
    {% set TEMP = params.TEMP|default(printer.extruder.target|int)|int %}
    PAUSE
    M117 正在卸载耗材，TEMP={TEMP}...
    UNLOAD_FILAMENT TEMP={TEMP}
    M117 请换料后运行 LOAD_FILAMENT TEMP={TEMP}，再点 RESUME


