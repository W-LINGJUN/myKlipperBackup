#####################################################################
#  VORON 2.4 300mm
#  BTT Octopus V1 + Nitehawk SB V2 (toolhead) + BTT Eddy (探针)
#
#  本文件是「入口文件」，只保留 include 列表、全局运动参数和
#  自动生成的 SAVE_CONFIG 块。具体配置全部在子文件中：
#
#    hardware/   —— 硬件：MCU、电机、挤出机、热床、风扇、灯、探针、传感器
#    macros/     —— 宏：开机宏、打印宏、换料宏、灯光宏、校准宏
#
#  改动结构后请确认 SAVE_CONFIG 块始终在本文件最末尾。
#####################################################################

#--------------------- 硬件模块 ---------------------
[include hardware/mcu.cfg]
[include hardware/steppers.cfg]
[include hardware/extruder.cfg]
[include hardware/heater-bed.cfg]
[include hardware/fans.cfg]
[include hardware/leds.cfg]
[include hardware/probe-eddy.cfg]
[include hardware/homing.cfg]
[include hardware/accelerometer.cfg]
[include hardware/sensors.cfg]

#--------------------- 客户端宏（Mainsail 官方，只读）---------------------
[include mainsail.cfg]

#--------------------- 自定义宏 ---------------------
[include macros/homing-tools.cfg]
[include macros/lights.cfg]
[include macros/filament.cfg]
[include macros/print-start.cfg]
[include macros/print-end.cfg]
[include macros/calibration.cfg]

#--------------------- KAMP 自适应网格 / 清洗 ---------------------
# 上游：https://github.com/kyleisah/Klipper-Adaptive-Meshing-Purging (GPL-3.0)
# 参数统一在 KAMP/KAMP_Settings.cfg 里改；每个文件只能被 include 一次。
# 生效前提：切片软件开启对象标签 + moonraker.conf 的 enable_object_processing: True
[include KAMP/KAMP_Settings.cfg]
[include KAMP/Adaptive_Meshing.cfg]      # 覆写 BED_MESH_CALIBRATE，按模型范围出小网格
[include KAMP/Line_Purge.cfg]            # LINE_PURGE：贴着模型区做清洗线
[include KAMP/Voron_Purge.cfg]           # VORON_PURGE：用 Voron logo 当清洗线
[include KAMP/Smart_Park.cfg]            # SMART_PARK：打印前停在模型附近等升温

#--------------------- 可选：延时摄影 ---------------------
# 需要先在主机上装好 moonraker-timelapse，并在 moonraker.conf 里
# 启用 [timelapse] 段，再取消下面这行注释。详见 README.md。
# [include timelapse.cfg]


#####################################################################
#  全局运动参数
#####################################################################
[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000             # 跑完 CALIBRATE_SHAPER + SAVE_CONFIG 后可上调到 4000~8000
max_z_velocity: 15
max_z_accel: 350
square_corner_velocity: 5.0

[gcode_arcs]
# Bambu Studio / Orca 打开「圆弧拟合」后会输出 G2/G3 圆弧指令。
# Klipper 默认不注册 G2/G3，遇到就回一句 Unknown command 并把整条指令丢掉 ——
# 圆弧段的移动和挤出全部消失，打印机不会停，但打出来的模型是残废的。
# 启用本段后 G2/G3 正常执行。resolution 是圆弧离散成线段的精度（mm），
# 0.5 对 0.4 喷嘴足够细，也不会让 Pi 4 处理不过来。
resolution: 0.5

[idle_timeout]
timeout: 1800

##  允许切片软件按对象排除打印
##  必须同时把 moonraker.conf 里的 enable_object_processing 设为 True，
##  否则 Mainsail 的对象标签不会生成，这个功能实际不可用。
[exclude_object]

